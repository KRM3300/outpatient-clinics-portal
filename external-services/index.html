<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأنظمة والخدمات الإلكترونية | العيادات الخارجية</title><link rel="stylesheet" href="../assets/portal.css"><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f8fa;color:#143b52;margin:0}.wrap{max-width:1080px;margin:auto;padding:25px 18px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}.head a{color:#126782}.sub{color:#627886}#search{width:100%;box-sizing:border-box;padding:14px;border:1px solid #cbdde6;border-radius:12px;font:inherit;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}.service{background:white;border:1px solid #dce8ed;border-radius:16px;min-height:160px;padding:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:10px}.mark{display:grid;place-items:center;width:75px;height:68px;border-radius:16px;background:#eaf4f8;color:#136b86;font-size:25px;font-weight:bold}.service img{width:100px;height:70px;object-fit:contain}.service strong{font-size:15px}.service small{color:#637b88}.service a{color:#086b85}.service button{font:inherit;border:0;border-radius:9px;padding:7px 12px;background:#edf1f4;color:#677983;cursor:not-allowed}.hidden{display:none!important}#gate{margin:65px auto;max-width:480px;text-align:center;background:white;border-radius:18px;padding:28px;border:1px solid #dce8ed}#content{display:none}h1{font-size:24px}h2{font-size:19px;margin:24px 0 14px}</style></head><body><main class="wrap"><div class="head"><h1>الأنظمة والخدمات الإلكترونية</h1><a href="../">العودة للمنصة</a></div><div id="gate" role="status">جارٍ التحقق من تسجيل الدخول واعتماد الحساب...</div><section id="content"><p class="sub">دليل الأنظمة والخدمات المشتركة وتجمع القصيم الصحي. الروابط التي لم تُتحقق بعد غير مفعّلة.</p><input id="search" type="search" placeholder="ابحث باسم الخدمة..." aria-label="البحث عن الخدمات"><h2>تجمع القصيم الصحي</h2><div id="qassim" class="grid"></div><h2>الأنظمة والخدمات العامة</h2><div id="general" class="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const services=[{"name":"إفادة","group":"general","link":null,"logo":null},{"name":"نظام موعد","group":"general","link":null,"logo":null},{"name":"الملف الإلكتروني الموحد (رقيم)","group":"general","link":null,"logo":null},{"name":"أناة","group":"general","link":null,"logo":null},{"name":"إدارة الأزمات والطوارئ","group":"general","link":null,"logo":null},{"name":"تبليغ الولادة","group":"general","link":null,"logo":null},{"name":"النظام الإحصائي","group":"general","link":null,"logo":null},{"name":"تسجيل الأحداث الجسيمة","group":"general","link":null,"logo":null},{"name":"الترميز الطبي","group":"general","link":null,"logo":null},{"name":"موصول نوبكو","group":"general","link":null,"logo":null},{"name":"قياس رضا المرضى","group":"general","link":null,"logo":null},{"name":"موقع وزارة الصحة","group":"general","link":null,"logo":null},{"name":"إدارة الأسرة","group":"general","link":null,"logo":null},{"name":"برنامج الزواج الصحي","group":"general","link":null,"logo":null},{"name":"برنامج مكافحة التدخين","group":"general","link":null,"logo":null},{"name":"برنامج مراقبة السموم","group":"general","link":null,"logo":null},{"name":"تجمع القصيم الصحي","group":"qassim","link":null,"logo":null},{"name":"تيقظ","group":"general","link":null,"logo":null},{"name":"المركز السعودي لسلامة المرضى","group":"general","link":null,"logo":null},{"name":"منصة صحة","group":"general","link":null,"logo":null},{"name":"استعادة كلمة المرور - موارد","group":"general","link":null,"logo":null},{"name":"جمعية القلب الأمريكية","group":"general","link":null,"logo":null},{"name":"بوابة مقيم","group":"general","link":null,"logo":null},{"name":"ممارس بلس","group":"general","link":null,"logo":null},{"name":"التطوع الصحي","group":"general","link":null,"logo":null},{"name":"مجلس الضمان الصحي","group":"general","link":null,"logo":null},{"name":"متأهب (الهلال الأحمر السعودي)","group":"general","link":null,"logo":null},{"name":"منصة مسار","group":"general","link":null,"logo":null},{"name":"نظام وصفتي","group":"general","link":null,"logo":null},{"name":"تسجيل الأخطاء الدوائية","group":"general","link":null,"logo":null},{"name":"موارد","group":"general","link":null,"logo":null},{"name":"الإحالات","group":"general","link":null,"logo":null},{"name":"منصة اعتماد","group":"general","link":null,"logo":null},{"name":"المؤسسة العامة للتأمينات الاجتماعية","group":"general","link":null,"logo":null}];
const gate=document.getElementById('gate'),content=document.getElementById('content');
function render(q=''){for(const id of ['qassim','general'])document.getElementById(id).replaceChildren();for(const x of services.filter(x=>x.name.includes(q.trim()))){const card=document.createElement('article');card.className='service';const mark=document.createElement('span');mark.className='mark';mark.textContent=x.name.slice(0,2);if(x.logo){const img=document.createElement('img');img.src=x.logo;img.alt='شعار '+x.name;img.onerror=()=>img.replaceWith(mark);card.append(img)}else card.append(mark);const name=document.createElement('strong');name.textContent=x.name;card.append(name);if(x.link){const a=document.createElement('a');a.href=x.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='فتح الخدمة';card.append(a)}else{const btn=document.createElement('button');btn.type='button';btn.disabled=true;btn.textContent='الرابط قريبًا';card.append(btn)}document.getElementById(x.group).append(card)}}
document.getElementById('search').addEventListener('input',e=>render(e.target.value));
(async()=>{try{if(!window.supabase)throw Error('تعذر تحميل خدمة التحقق');const api=window.supabase.createClient('https://omugonzzrulsdpnycact.supabase.co','sb_publishable_f3IjPvIbMruO9jGb4SmT7Q_NOqgEbXs');const {data:{user},error:authError}=await api.auth.getUser();if(authError||!user)throw Error('يلزم تسجيل الدخول إلى المنصة أولًا');const {data,error}=await api.from('opd_appt_members').select('status').eq('user_id',user.id).maybeSingle();if(error||data?.status!=='approved')throw Error('الخدمة متاحة للحسابات المعتمدة فقط');render();gate.style.display='none';content.style.display='block'}catch(e){gate.textContent=e.message+' — ارجع إلى الصفحة الرئيسية لتسجيل الدخول.'}})();
</script></body></html>
