      /* أسماء الأنماط تبدأ بـ xs- حتى لا تتعارض مع أنماط المنصة العامة */
      .xs-tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 0 0 12px; }
      .xs-tools input { flex: 1 1 260px; margin: 0; }
      .xs-count { color: var(--ink-soft); font-size: 14px; white-space: nowrap; }
      .xs-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
      .xs-chips button { min-height: 38px; padding: 6px 14px; }
      .xs-chips button[aria-pressed="true"] { background: var(--header); color: #fff; border-color: var(--header); }
      .xs-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 14px; background: #0e6470; padding: 18px; border-radius: var(--radius-lg); }
      .xs-tile { display: block; border-radius: 22px; overflow: hidden; background: transparent; transition: transform 0.15s ease, box-shadow 0.15s ease; }
      .xs-tile img { display: block; width: 100%; height: auto; aspect-ratio: 2 / 3; object-fit: cover; }
      .xs-tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); }
      .xs-tile:focus-visible { outline: 3px solid #ffd76a; outline-offset: 3px; }
      .xs-empty { grid-column: 1 / -1; color: #fff; text-align: center; padding: 30px 0; }
      .xs-note { color: var(--ink-soft); font-size: 13px; margin: 12px 0 0; }
      @media (max-width: 1000px) { .xs-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      @media (max-width: 680px) { .xs-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; padding: 10px; } .xs-tile { border-radius: 14px; } }
      @media (prefers-reduced-motion: reduce) { .xs-tile { transition: none; } .xs-tile:hover { transform: none; } }

        const grid = document.getElementById("grid"), q = document.getElementById("q"), count = document.getElementById("count");
        let group = "all";
        function draw() {
          const t = norm(q.value.trim());
          const list = S.filter((x) => (group === "all" || x.g === group) && (!t || norm(x.n + " " + x.e + " " + new URL(x.u).hostname).includes(t)));
          grid.replaceChildren();
          count.textContent = list.length + " من " + S.length;
          if (!list.length) {
            const p = document.createElement("p");
            p.className = "xs-empty";
            p.textContent = "ما فيه نتائج. جرّب كلمة ثانية.";
            grid.append(p);
            return;
          }
          for (const x of list) {
            const a = document.createElement("a");
            a.className = "xs-tile";
            a.href = x.u;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.title = x.n + " — " + x.e;
            const img = document.createElement("img");
            img.src = LOGOS + x.i;
            img.alt = x.n + " (" + x.e + ")";
            img.loading = "lazy";
            img.decoding = "async";
            img.width = 500;
            img.height = 750;
            a.append(img);
            grid.append(a);
          }
        }
