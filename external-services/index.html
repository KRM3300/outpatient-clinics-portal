<title>الأنظمة والخدمات الإلكترونية | منصة العيادات الخارجية</title>

<style>
:root{--ink:#123b52;--muted:#6b7f8b;--line:#dce7ec;--soft:#f4f8fa;--brand:#0f617d;--brand2:#0f3a57}
*{box-sizing:border-box}
body{margin:0;background:#f5f8fa;color:var(--ink);font-family:Tahoma,Arial,sans-serif}
.shell{max-width:1160px;margin:auto;padding:24px 18px 45px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}
.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--brand);font-weight:800}
h1{font-size:clamp(23px,4vw,32px);margin:10px 0 5px}
.lead{margin:0;color:var(--muted);line-height:1.8}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 14px}
.search{flex:1;min-width:230px;margin:0!important}
.search input{width:100%}
.count{background:#e8f3f7;color:#0d617c;border-radius:999px;padding:8px 12px;font-weight:800;white-space:nowrap}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 16px}
.chipx{border:1px solid #cfe0e7;background:white;color:#315569;border-radius:999px;padding:9px 13px;font:inherit;font-weight:700;white-space:nowrap;cursor:pointer}
.chipx.active{background:var(--brand2);color:white;border-color:var(--brand2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}
.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px 14px;min-height:210px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 4px 18px rgba(20,59,82,.04)}
.logoBox{height:78px;width:130px;display:grid;place-items:center;margin-bottom:8px}
.logoBox img{max-width:100%;max-height:72px;object-fit:contain;display:block}
.fallback{display:grid;place-items:center;width:68px;height:62px;border-radius:14px;background:#eaf4f8;color:#10637e;font-weight:900;font-size:22px}
.card h2{font-size:15px;line-height:1.65;margin:3px 0 2px}
.en{font-size:11px;color:#7a8d97;min-height:30px;line-height:1.35}
.open{margin-top:auto;width:100%;border:0;border-radius:10px;padding:9px 10px;font:inherit;font-weight:800;background:#eef2f4;color:#81919a;cursor:not-allowed}
.badge{font-size:10px;background:#edf7f2;color:#287356;border-radius:999px;padding:4px 8px;margin-top:5px}
.empty{grid-column:1/-1;text-align:center;padding:35px;color:var(--muted)}
#gate{max-width:540px;margin:65px auto;background:white;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center;box-shadow:0 6px 22px rgba(20,59,82,.06)}
#content{display:none}
.note{font-size:12px;color:#7b8c95;margin:16px 2px}
@media(max-width:520px){.shell{padding:17px 12px 35px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:195px;padding:13px 9px}.logoBox{width:105px;height:68px}.logoBox img{max-height:62px}.card h2{font-size:13px}.en{font-size:10px}.top{align-items:flex-start}}
</style>
</head>

  const {data:{user},error:authError}=await api.auth.getUser();
  if(authError||!user)throw Error("يلزم تسجيل الدخول إلى المنصة أولًا");
  const {data,error}=await api.from("opd_appt_members").select("status").eq("user_id",user.id).maybeSingle();
  if(error||data?.status!=="approved")throw Error("الخدمة متاحة للحسابات المعتمدة فقط");
  draw();gate.style.display="none";content.style.display="block";
 }catch(e){gate.textContent=e.message+" — ارجع إلى الصفحة الرئيسية لتسجيل الدخول."}
})();
</script>
