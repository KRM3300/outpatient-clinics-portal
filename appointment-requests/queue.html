<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قائمة طلبات المواعيد الموحدة</title><style>body{font:15px system-ui,Tahoma;background:#071725;color:#eaf5fb;margin:0}main{max-width:960px;margin:auto;padding:24px}a{color:#91dcfa}select,button{background:#123a50;color:white;border:1px solid #487084;border-radius:9px;padding:11px;margin:5px;font:inherit}.item{background:#102b40;border:1px solid #315a6d;border-radius:13px;margin:12px 0;padding:15px;line-height:2}.note{color:#f7dca2}</style><main><a href="../">العودة للتطبيق</a><h1>قائمة طلبات المواعيد الموحدة</h1><p class="note">نسخة تجريبية: تعرض طلبات هذا المتصفح فقط. لا توجد بيانات مرضى فعلية أو حجز في VIDA.</p><label>تصفية حسب الخدمة <select id="filter"><option value="all">جميع الطلبات</option><option value="emergency">طلبات الطوارئ</option><option value="followup">طلبات المتابعة</option></select></label><label>الحالة <select id="status"><option value="all">كل الحالات</option><option value="pending">بانتظار الحجز</option></select></label><div id="summary"></div><section id="items"></section></main><script>(()=>{'use strict';const $=x=>document.getElementById(x),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let data=[];try{data=JSON.parse(localStorage.getItem('opd_demo_appointments_v1')||'[]')}catch{}const kind=$('filter').value;if(kind!=='all')data=data.filter(x=>x.type===kind);$('summary').textContent='عدد الطلبات: '+data.length;$('items').innerHTML=data.length?data.map(r=>'<article class="item"><strong>'+(r.type==='emergency'?'طوارئ':'متابعة')+'</strong> · '+safe(r.id)+'<div>'+safe(r.patient)+' · '+safe(r.clinic)+' · '+safe(r.doctor)+'</div><div>'+safe(r.date)+' · '+safe(r.period)+'</div><small>بانتظار الحجز (تجريبي)</small></article>').join(''):'<p>لا توجد طلبات مطابقة.</p>'} $('filter').onchange=render;$('status').onchange=render;render()})();</script></html>
